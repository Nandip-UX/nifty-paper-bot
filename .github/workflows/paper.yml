# Runs one paper-trading session every weekday on GitHub's servers (no Mac needed) and saves
# the journal, day report and log into cloud/. Yahoo data, paper only: no keys, no real orders.
name: paper-trading

on:
  schedule:  # GitHub starts schedules late or skips them when busy, so several triggers:
    - cron: "15 3 * * 1-5"  # 08:45 IST; the first one to start runs the session, later ones
    - cron: "47 3 * * 1-5"  # 09:17 IST  queue behind it and exit in a minute (market closed)
    - cron: "20 4 * * 1-5"  # 09:50 IST
    - cron: "0 5 * * 1-5"   # 10:30 IST
  workflow_dispatch: {}      # "Run workflow" button for a manual start
  push:                      # a Claude routine pushes here at 09:15 IST: the reliable starter
    branches: [session-trigger]

permissions:
  contents: write

concurrency: paper-trading  # never two sessions at once

jobs:
  session:
    runs-on: ubuntu-latest
    timeout-minutes: 360  # GitHub's hard cap is 6 h; starting at/after 09:20 the day ends ~15:16
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: pip install requests
      - run: python test_core.py
      - name: Trade the session (paper)
        env:
          BROKER: yahoo
          DATA_DIR: cloud
        run: |
          # GitHub kills jobs after 6 h: square off 10 min before that if the job started early
          export END_BY=$(TZ=Asia/Kolkata date -d '+350 min' +%H:%M)
          python bot.py
      - name: Save today's real NIFTY weekly option prices (research data)
        if: always()
        continue-on-error: true
        run: python fetch_data.py today
      - name: Save journal, report and log to the repo
        if: always()
        run: |
          git config user.name "paper-bot"
          git config user.email "paper-bot@users.noreply.github.com"
          git add cloud
          git commit -m "paper session $(TZ=Asia/Kolkata date +%F)" || exit 0
          git fetch origin main && git rebase -X ours origin/main && git push origin HEAD:main  # results land on main; a late duplicate run never overwrites the real session's files

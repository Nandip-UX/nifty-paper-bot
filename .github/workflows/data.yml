# Manual: downloads years of 5-min NIFTY + India VIX candles for strategy research.
# The CSVs are kept as a run artifact (not committed): gh run download <id> -n market-data
name: fetch-data
on:
  workflow_dispatch:
    inputs:
      start:
        description: first date (YYYY-MM-DD)
        default: "2022-01-01"
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: pip install requests
      - run: python fetch_data.py ${{ inputs.start }}
      - uses: actions/upload-artifact@v4
        with:
          name: market-data
          path: data/
          retention-days: 90
